[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clearask-faq-assistant"
version = "0.1.0"
description = "A small, reproducible experiment in robust FAQ retrieval and abstention."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["scikit-learn>=1.4,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
clearask-evaluate = "clearask.evaluate:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
